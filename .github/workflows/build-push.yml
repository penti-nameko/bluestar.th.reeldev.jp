name: Build & Push to ghcr.io

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "argocd/**"
      - "k8s/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "argocd/**"
      - "k8s/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # <org>/<repo> がそのままイメージ名になる

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # git-auto-commit-action によるタグ書き換えコミットのプッシュに必要
      packages: write   # ghcr.io へのプッシュに必要

    steps:
      # ── 1. Checkout (Node 24に対応したv6へ変更) ───────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      # ── 2. Docker Buildx (Node 24に対応したv4へ変更) ──────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── 3. ghcr.io ログイン (Node 24に対応したv4へ変更) ───────────────────
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. イメージメタデータ生成 ─────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr

      # ── 5. ビルド & プッシュ ─────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. デプロイメントのイメージタグを更新 ─────────────────────────
      - name: Update image tag in deployment.yaml
        if: github.event_name != 'pull_request'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          sed -i "s|image: .*apex-protocol.*|image: ${NEW_IMAGE}|g" k8s/deployment.yaml
          echo "Updated image to: ${NEW_IMAGE}"

      - name: Commit updated deployment.yaml
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update image tag to sha-${{ github.sha }}"
          file_pattern: k8s/deployment.yaml
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
